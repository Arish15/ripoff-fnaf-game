<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Five Nights at Freddy's</title>
    <link rel="stylesheet" href="src/css/styles.css">
    <link rel="stylesheet" href="src/css/office.css">
    <!-- Three.js r152 — served locally (CDN path for r163 doesn't exist) -->
    <script src="src/js/three.min.js"></script>
</head>
<body>
    <!-- Audio Assets — drop matching files into src/assets/ to enable sound -->
    <audio id="doorAudio">
        <source src="src/assets/door.mp3" type="audio/mpeg">
        <source src="src/assets/door.ogg" type="audio/ogg">
    </audio>
    <audio id="jumpScareAudio">
        <source src="src/assets/jumpscare.mp3" type="audio/mpeg">
        <source src="src/assets/jumpscare.ogg" type="audio/ogg">
    </audio>
    <audio id="powerOutAudio">
        <source src="src/assets/powerout.mp3" type="audio/mpeg">
        <source src="src/assets/powerout.ogg" type="audio/ogg">
    </audio>
    <audio id="successAudio">
        <source src="src/assets/success.mp3" type="audio/mpeg">
        <source src="src/assets/success.ogg" type="audio/ogg">
    </audio>

    <div id="startScreen">
        <h1 id="title">FIVE NIGHTS<br>AT FREDDY'S</h1>
        <p id="screenName"> &bull; Night Selection</p>
        <div class="nightSelector">
            <button class="nightBtn" onclick="window.startGame && window.startGame(1)">Night 1</button>
            <button class="nightBtn" onclick="window.startGame && window.startGame(2)">Night 2</button>
            <button class="nightBtn" onclick="window.startGame && window.startGame(3)">Night 3</button>
            <button class="nightBtn" onclick="window.startGame && window.startGame(4)">Night 4</button>
            <button class="nightBtn" onclick="window.startGame && window.startGame(5)">Night 5</button>
            <button class="nightBtn" onclick="window.startGame && window.startGame(6)">Night 6</button>
        </div>
    </div>

    <div id="gameContainer">
        <!-- Monitor Area with Controls -->
        <div id="monitorArea">
            <!-- Center Camera Monitor -->
            <div id="monitorStand">
                <canvas id="cameraCanvas"></canvas>
            </div>
        </div>
    </div>

    <!-- Office view — outside #gameContainer so position:fixed is in the root stacking context -->
    <div id="officeArea">
        <!-- Three.js renders here; office3d.js populates this div -->
        <div id="officeScene"></div>

        <!-- Door buttons (left) -->
        <button class="office-btn office-btn-door-left" onclick="window.toggleDoor && window.toggleDoor('left')">DOOR</button>
        <button class="office-btn office-btn-light-left" onclick="window.toggleLight && window.toggleLight('left')">LIGHT</button>

        <!-- Door buttons (right) -->
        <button class="office-btn office-btn-door-right" onclick="window.toggleDoor && window.toggleDoor('right')">DOOR</button>
        <button class="office-btn office-btn-light-right" onclick="window.toggleLight && window.toggleLight('right')">LIGHT</button>

        <!-- Vignette overlay -->
        <div class="office-vignette"></div>
    </div>

    <!-- Camera Toggle Button - Bottom Center (FNAF1 style) -->
    <button id="cameraToggleBtn">
        <span class="cameraBtnIcon">
            <svg width="60" height="16" viewBox="0 0 60 16">
                <polyline points="10,6 30,12 50,6" stroke="#aaa" stroke-width="3" fill="none" />
                <polyline points="10,12 30,16 50,12" stroke="#aaa" stroke-width="3" fill="none" />
            </svg>
        </span>
    </button>

    <!-- Hidden Camera Grid - Shows on button click -->
    <!-- Layout matches FNAF1 building schematic -->
    <div id="cameraGrid">
        <!-- Connecting corridor lines -->
        <svg id="camMapSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 215" preserveAspectRatio="none">
            <g stroke="#4a4a4a" stroke-width="1.5" fill="none" stroke-linecap="square">
                <!-- 1A to 1B (top to second row left-center) -->
                <line x1="142" y1="25" x2="75" y2="67"/>
                <!-- 1A to 7 (stage to main hall, right side) -->
                <polyline points="188,25 300,25 300,67 279,67"/>
                <!-- 5 to 1B (backstage to dining horizontal) -->
                <line x1="27" y1="67" x2="75" y2="67"/>
                <!-- 1B to 1C (dining to pirate cove vertical) -->
                <line x1="75" y1="67" x2="75" y2="102"/>
                <!-- 5 down to 3 (backstage to east hall vertical) -->
                <line x1="26" y1="67" x2="26" y2="102"/>
                <!-- 3 to 1C (east hall to pirate cove horizontal) -->
                <line x1="26" y1="102" x2="75" y2="102"/>
                <!-- 1C down to 2A (pirate cove to west hall vertical) -->
                <line x1="75" y1="102" x2="75" y2="137"/>
                <!-- 4A to 6 (east hall corner to kitchen horizontal) -->
                <line x1="217" y1="102" x2="279" y2="102"/>
                <!-- 6 down to 7 (kitchen to main hall vertical) -->
                <line x1="279" y1="102" x2="279" y2="67"/>
                <!-- 2A down to 2B (west hall hierarchy) -->
                <line x1="75" y1="137" x2="75" y2="172"/>
                <!-- 2B to YOU (corridor to office left) -->
                <line x1="75" y1="172" x2="142" y2="172"/>
                <!-- YOU to 4B (office to east side right) -->
                <line x1="188" y1="172" x2="217" y2="172"/>
                <!-- 4B up to 4A (east hall corner upward) -->
                <line x1="217" y1="172" x2="217" y2="102"/>
            </g>
        </svg>

        <button class="camBtn" data-cam="stage"        style="left:142px;top:8px"   >CAM<br>1A</button>
        
        <button class="camBtn" data-cam="backstage"    style="left:8px;top:50px"   >CAM<br>5</button>
        <button class="camBtn" data-cam="dining"       style="left:75px;top:50px"  >CAM<br>1B</button>
        <button class="camBtn" data-cam="stage_right"  style="left:279px;top:50px" >CAM<br>7</button>
        
        <button class="camBtn" data-cam="hallE"        style="left:8px;top:85px"   >CAM<br>3</button>
        <button class="camBtn" data-cam="pirate"       style="left:75px;top:85px"  >CAM<br>1C</button>
        <button class="camBtn" data-cam="hallE_corner" style="left:217px;top:85px" >CAM<br>4A</button>
        <button class="camBtn" data-cam="kitchen"      style="left:279px;top:85px" >CAM<br>6</button>
        
        <button class="camBtn" data-cam="hallW"        style="left:75px;top:120px" >CAM<br>2A</button>
        
        <button class="camBtn" data-cam="hallW_corner" style="left:75px;top:155px" >CAM<br>2B</button>
        <button class="camBtn" data-cam="stage_left"   style="left:217px;top:155px">CAM<br>4B</button>
        <!-- YOU marker -->
        <div class="cam-you">YOU<span class="cam-you-dot"></span></div>
    </div>

    <!-- Power & Usage Display - Bottom Left Fixed -->
    <div id="powerArea">
        <div id="powerDisplay">100%</div>
        <div class="usageContainer">
            <div class="usageBar" id="barLights">
                <div class="usageLabel">L</div>
                <div class="usageBarBg"><div class="usageBarFill" id="usageLights"></div></div>
            </div>
            <div class="usageBar" id="barDoors">
                <div class="usageLabel">D</div>
                <div class="usageBarBg"><div class="usageBarFill" id="usageDoors"></div></div>
            </div>
            <div class="usageBar" id="barCamera">
                <div class="usageLabel">C</div>
                <div class="usageBarBg"><div class="usageBarFill" id="usageCamera"></div></div>
            </div>
        </div>
    </div>

    <!-- Time Display - always visible top-right -->
    <div id="timeDisplay">12 AM</div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen">
        <div id="jumpScare"></div>
        <div id="gameOverContent">
            <h1>GAME OVER</h1>
            <button class="retryBtn" onclick="window.returnToStart && window.returnToStart()">MAIN MENU</button>
            <button class="retryBtn" onclick="window.startGame && window.startGame(window.gameState?.currentNight || 1)">RETRY</button>
        </div>
    </div>

    <!-- Night Complete Screen -->
    <div id="nightCompleteScreen">
        <div id="nightCompleteContent">
            <h1>6:00 AM</h1>
            <div id="nightCompleteMessage">YOU SURVIVED THE NIGHT.</div>
            <button class="nextBtn" onclick="window.nextNight && window.nextNight()">CONTINUE</button>
            <button class="nextBtn" onclick="window.returnToStart && window.returnToStart()">MAIN MENU</button>
        </div>
    </div>

    <script src="src/js/office3d.js?v=20260302"></script>
    <script src="src/js/state.js?v=20260302"></script>
    <script src="src/js/assets.js?v=20260302"></script>
    <script src="src/js/office.js?v=20260302"></script>
    <script src="src/js/cameras.js?v=20260302"></script>
    <script src="src/js/ai.js?v=20260302"></script>
    <script src="src/js/game.js?v=20260302"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Five Nights at Freddy's</title>
    <link rel="stylesheet" href="src/css/styles.css">
    <link rel="stylesheet" href="src/css/office.css">
    <!-- Three.js r152 — served locally (CDN path for r163 doesn't exist) -->
    <script src="src/js/three.min.js"></script>
</head>

<body>
    <!-- Audio Assets — drop matching files into src/assets/ to enable sound -->
    <audio id="doorAudio">
        <source src="src/assets/door.mp3" type="audio/mpeg">
        <source src="src/assets/door.ogg" type="audio/ogg">
    </audio>
    <audio id="jumpScareAudio">
        <source src="src/assets/jumpscare.mp3" type="audio/mpeg">
        <source src="src/assets/jumpscare.ogg" type="audio/ogg">
    </audio>
    <audio id="powerOutAudio">
        <source src="src/assets/powerout.mp3" type="audio/mpeg">
        <source src="src/assets/powerout.ogg" type="audio/ogg">
    </audio>
    <audio id="successAudio">
        <source src="src/assets/success.mp3" type="audio/mpeg">
        <source src="src/assets/success.ogg" type="audio/ogg">
    </audio>

    <div id="startScreen">
        <h1 id="title">FIVE NIGHTS<br>AT FREDDY'S</h1>
        <p id="screenName"> &bull; Night Selection</p>
        <div class="nightSelector">
            <button class="nightBtn" onclick="window.startGame && window.startGame(1)">Night 1</button>
            <button class="nightBtn" onclick="window.startGame && window.startGame(2)">Night 2</button>
            <button class="nightBtn" onclick="window.startGame && window.startGame(3)">Night 3</button>
            <button class="nightBtn" onclick="window.startGame && window.startGame(4)">Night 4</button>
            <button class="nightBtn" onclick="window.startGame && window.startGame(5)">Night 5</button>
            <button class="nightBtn" onclick="window.startGame && window.startGame(6)">Night 6</button>
        </div>
    </div>

    <div id="gameContainer">
        <!-- Monitor Area with Controls -->
        <div id="monitorArea">
            <!-- Center Camera Monitor -->
            <div id="monitorStand">
                <canvas id="cameraCanvas"></canvas>
            </div>
        </div>
    </div>

    <!-- Office view — outside #gameContainer so position:fixed is in the root stacking context -->
    <div id="officeArea">
        <!-- Three.js renders here; office3d.js populates this div -->
        <div id="officeScene"></div>

        <!-- Door buttons (left) -->
        <button class="office-btn office-btn-door-left" onclick="window.toggleDoor && window.toggleDoor('left')">DOOR</button>
        <button class="office-btn office-btn-light-left" onclick="window.toggleLight && window.toggleLight('left')">LIGHT</button>

        <!-- Door buttons (right) -->
        <button class="office-btn office-btn-door-right" onclick="window.toggleDoor && window.toggleDoor('right')">DOOR</button>
        <button class="office-btn office-btn-light-right" onclick="window.toggleLight && window.toggleLight('right')">LIGHT</button>

        <!-- Vignette overlay -->
        <div class="office-vignette"></div>
    </div>

    <!-- Camera Toggle Button - Bottom Center (FNAF1 style) -->
    <button id="cameraToggleBtn">
        <span class="cameraBtnIcon">
            <svg width="60" height="16" viewBox="0 0 60 16">
                <polyline points="10,6 30,12 50,6" stroke="#aaa" stroke-width="3" fill="none" />
                <polyline points="10,12 30,16 50,12" stroke="#aaa" stroke-width="3" fill="none" />
            </svg>
        </span>
    </button>

    <!-- Hidden Camera Grid - Shows on button click -->
    <!-- Layout matches FNAF1 building floor plan exactly:
         Row 1: [5-BACKSTAGE] [1A-STAGE] [6-KITCHEN]
         Row 2: [1C-PIRATE]   [1B-DINING] [7-RESTROOMS]
         Row 3: [2A-W.HALL]   [3-SUPPLY]  [4A-E.HALL]
         Row 4: [2B-W.CORNER] [YOU]       [4B-E.CORNER]  -->
    <div id="cameraGrid">
        <!-- Corridor connection lines — endpoints are button centers (left+31, top+22) -->
        <svg id="camMapSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 330">
            <g stroke="#5a5a5a" stroke-width="1.5" fill="none" stroke-linecap="square">
                <!-- Backstage(5) ↔ Show Stage(1A) — back-of-stage connection -->
                <line x1="41" y1="40" x2="216" y2="40"/>
                <!-- Show Stage(1A) ↓ Dining Area(1B) — main path down -->
                <line x1="216" y1="40" x2="216" y2="122"/>
                <!-- Dining(1B) → Restrooms(7) — right side room -->
                <line x1="216" y1="122" x2="376" y2="122"/>
                <!-- Dining(1B) ↙ W.Hall(2A) — Bonnie/Foxy approach left -->
                <line x1="216" y1="122" x2="41" y2="207"/>
                <!-- Dining(1B) ↘ E.Hall(4A) — Freddy/Chica approach right -->
                <line x1="216" y1="122" x2="351" y2="207"/>
                <!-- Dining(1B) ↓ Supply Closet(3) — back room spur -->
                <line x1="216" y1="122" x2="191" y2="207"/>
                <!-- Pirate's Cove(1C) ↓ W.Hall(2A) — Foxy exits left -->
                <line x1="41" y1="122" x2="41" y2="207"/>
                <!-- W.Hall(2A) ↓ W.Hall Corner(2B) — left corridor -->
                <line x1="41" y1="207" x2="41" y2="287"/>
                <!-- E.Hall(4A) ↓ E.Hall Corner(4B) — right corridor -->
                <line x1="351" y1="207" x2="476" y2="287"/>
                <!-- W.Hall Corner(2B) → YOU — left door approach -->
                <line x1="41" y1="287" x2="265" y2="287"/>
                <!-- E.Hall Corner(4B) → YOU — right door approach -->
                <line x1="476" y1="287" x2="265" y2="287"/>
            </g>
        </svg>

        <!-- ROW 1: Top — Backstage | Show Stage | Kitchen -->
        <button class="camBtn" data-cam="backstage" style="left:10px;top:18px">CAM<br>5</button>
        <button class="camBtn" data-cam="stage" style="left:185px;top:18px">CAM<br>1A</button>
        <button class="camBtn" data-cam="kitchen" style="left:442px;top:18px">CAM<br>6</button>

        <!-- ROW 2: Middle — Pirate's Cove | Dining Area | Restrooms -->
        <button class="camBtn" data-cam="pirate" style="left:10px;top:100px">CAM<br>1C</button>
        <button class="camBtn" data-cam="dining" style="left:185px;top:100px">CAM<br>1B</button>
        <button class="camBtn" data-cam="stage_right" style="left:345px;top:100px">CAM<br>7</button>

        <!-- ROW 3: Corridors — W. Hall | Supply Closet | E. Hall -->
        <button class="camBtn" data-cam="hallW" style="left:10px;top:185px">CAM<br>2A</button>
        <button class="camBtn" data-cam="hallE" style="left:160px;top:185px">CAM<br>3</button>
        <button class="camBtn" data-cam="hallE_corner" style="left:320px;top:185px">CAM<br>4A</button>

        <!-- ROW 4: Near Office — W. Corner | YOU | E. Corner -->
        <button class="camBtn" data-cam="hallW_corner" style="left:10px;top:265px">CAM<br>2B</button>
        <button class="camBtn" data-cam="stage_left" style="left:445px;top:265px">CAM<br>4B</button>
        <!-- YOU marker (office - non-clickable) -->
        <div class="cam-you" style="left:234px;top:265px;">YOU<span class="cam-you-dot"></span></div>
    </div>

    <!-- Power & Usage Display - Bottom Left Fixed (FNAF1 style) -->
    <div id="powerArea">
        <div id="powerLabel">Power left: <span id="powerDisplay">100</span>%</div>
        <div id="usageArea">
            <span id="usageLabel">Usage:</span>
            <span class="usage-block" id="usageBlock1"></span>
            <span class="usage-block" id="usageBlock2"></span>
            <span class="usage-block" id="usageBlock3"></span>
            <span class="usage-block" id="usageBlock4"></span>
            <span class="usage-block" id="usageBlock5"></span>
        </div>
    </div>

    <!-- Time Display - always visible top-right -->
    <div id="timeDisplay">12 AM</div>
    <div id="nightDisplay">NIGHT 1</div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen">
        <div id="jumpScare"></div>
        <div id="gameOverContent">
            <h1>GAME OVER</h1>
            <button class="retryBtn" onclick="window.returnToStart && window.returnToStart()">MAIN MENU</button>
            <button class="retryBtn" onclick="window.startGame && window.startGame(window.gameState?.currentNight || 1)">RETRY</button>
        </div>
    </div>

    <!-- Night Complete Screen -->
    <div id="nightCompleteScreen">
        <div id="nightCompleteContent">
            <h1>6:00 AM</h1>
            <div id="nightCompleteMessage">YAY!, YOU SURVIVED THE NIGHT.</div>
            <button class="nextBtn" onclick="window.nextNight && window.nextNight()">CONTINUE</button>
            <button class="nextBtn" onclick="window.returnToStart && window.returnToStart()">MAIN MENU</button>
        </div>
    </div>

    <script src="src/js/office3d.js?v=20260302"></script>
    <script src="src/js/state.js?v=20260302"></script>
    <script src="src/js/assets.js?v=20260302"></script>
    <script src="src/js/office.js?v=20260302"></script>
    <script src="src/js/cameras.js?v=20260302"></script>
    <script src="src/js/ai.js?v=20260302"></script>
    <script src="src/js/game.js?v=20260302"></script>

</body>

</html>
